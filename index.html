<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modification de disponibilités</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 20px auto;
    padding-bottom: 140px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
  }

  input, textarea {
    width: 100%;
    padding: 6px;
    margin-top: 4px;
    font-size: 16px;
  }

  .error {
    color: red;
    font-size: 14px;
    margin-top: 2px;
  }

  .info {
    background: #eef;
    padding: 10px;
    border-left: 4px solid #3366cc;
    margin-bottom: 20px;
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .slot-btn {
    padding: 12px;
    background: #2ecc71;
    border: none;
    color: white;
    border-radius: 4px;
    cursor: pointer;
  }

  .slot-btn.active { background: #e74c3c; }
  .slot-btn:disabled { background: #aaa; }

  .day-off {
    margin-top: 10px;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    width: 100%;
  }

  .day-off.active { background: red; }

  .hidden { display: none; }

  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 2px solid #3366cc;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .action-bar button {
    padding: 14px;
    font-size: 16px;
  }

  #resume {
    background: #f9f9ff;
    border: 2px solid #3366cc;
    padding: 15px;
    margin-top: 30px;
  }

  @media (min-width: 769px) {
    .action-bar { flex-direction: row; justify-content: center; }
    .action-bar button { width: auto; }
  }
</style>
</head>

<body>

<h1>Modification de disponibilités</h1>

<div class="info" id="tournamentInfo"></div>

<label>Nom *</label>
<input id="nom"><div id="errNom" class="error"></div>

<label>Prénom *</label>
<input id="prenom"><div id="errPrenom" class="error"></div>

<label>Email *</label>
<input id="email"><div id="errEmail" class="error"></div>

<label>Téléphone *</label>
<input id="telephone"><div id="errTel" class="error"></div>

<label>Commentaires</label>
<textarea id="commentaires" rows="3"></textarea>

<h2>Date à modifier *</h2>
<input type="date" id="date">

<button class="day-off" id="dayOffBtn">PAS DISPONIBLE CE JOUR</button>

<div class="slots" id="slots"></div>

<div class="action-bar">
  <button onclick="validerJournee()">Valider la journée</button>
  <button id="btnNouvelle" class="hidden" onclick="nouvelleJournee()">Autre date</button>
  <button id="btnTerminer" class="hidden" onclick="terminer()">Saisie terminée</button>
</div>

<div id="resume" class="hidden">
  <h2>Résumé avant envoi</h2>
  <ul id="resumeList"></ul>
  <button onclick="envoyer()">Confirmer l’envoi</button>
  <button onclick="supprimerEnvoi()">Supprimer l’envoi</button>
</div>

<script>
const TOURNAMENT_START = "2025-06-20";
const TOURNAMENT_END   = "2025-06-25";

const selections = [];
const slotsContainer = document.getElementById("slots");
const dayOffBtn = document.getElementById("dayOffBtn");
const dateInput = document.getElementById("date");

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("tournamentInfo").innerHTML =
    `Tournoi du ${TOURNAMENT_START} au ${TOURNAMENT_END}`;
  dateInput.min = TOURNAMENT_START;
  dateInput.max = TOURNAMENT_END;
  genererCreneaux();
});

function genererCreneaux() {
  for (let h = 8; h < 23; h++) {
    const b = document.createElement("button");
    b.className = "slot-btn";
    b.textContent = `${h}-${h+1}`;
    b.onclick = () => b.classList.toggle("active");
    slotsContainer.appendChild(b);
  }
}

dayOffBtn.onclick = () => {
  const a = dayOffBtn.classList.toggle("active");
  document.querySelectorAll(".slot-btn").forEach(b => {
    b.disabled = a;
    b.classList.remove("active");
  });
};

function clearErrors() {
  document.querySelectorAll(".error").forEach(e => e.textContent = "");
}

function validerIdentite() {
  clearErrors();
  let ok = true;

  if (nom.value.length < 2) {
    errNom.textContent = "Nom obligatoire (min 2 caractères)";
    ok = false;
  }

  if (prenom.value.length < 2) {
    errPrenom.textContent = "Prénom obligatoire";
    ok = false;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
    errEmail.textContent = "Email invalide";
    ok = false;
  }

  if (!/^[0-9]{10,15}$/.test(telephone.value)) {
    errTel.textContent = "Téléphone invalide (10 à 15 chiffres)";
    ok = false;
  }

  return ok;
}

function validerJournee() {
  if (!validerIdentite()) return;
  if (!dateInput.value) return alert("Date obligatoire");

  const creneaux = [];
  if (dayOffBtn.classList.contains("active")) {
    creneaux.push("PAS DISPONIBLE");
  } else {
    document.querySelectorAll(".slot-btn.active")
      .forEach(b => creneaux.push(b.textContent));
  }

  if (creneaux.length === 0) return alert("Sélectionnez au moins un créneau");

  selections.push({ date: dateInput.value, creneaux });
  alert("Journée enregistrée");

  btnNouvelle.classList.remove("hidden");
  btnTerminer.classList.remove("hidden");
}

function nouvelleJournee() {
  dateInput.value = "";
  dayOffBtn.classList.remove("active");
  document.querySelectorAll(".slot-btn").forEach(b => {
    b.disabled = false;
    b.classList.remove("active");
  });
}

function terminer() {
  resumeList.innerHTML = `
    <li><strong>${prenom.value} ${nom.value}</strong></li>
    <li>${email.value} – ${telephone.value}</li>
    <li><strong>Commentaires :</strong> ${commentaires.value || "Aucun"}</li>
  `;
  selections.forEach(s => {
    resumeList.innerHTML += `<li>${s.date} : ${s.creneaux.join(", ")}</li>`;
  });
  resume.classList.remove("hidden");
  resume.scrollIntoView({behavior:"smooth"});
}

function envoyer() {
  alert("Envoi validé");
  console.log(selections);
}

function supprimerEnvoi() {
  location.reload();
}
</script>

</body>
</html>
