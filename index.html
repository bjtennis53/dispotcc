<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OPEN TENNIS CLUB CHARBONNIERES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Roboto,sans-serif;
background:#e8f5e9;
margin:0;
color:#1b5e20;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
text-align:center;
}

header img{
max-width:140px;
}

h1{color:#2e7d32;}

.explain{
background:#c8e6c9;
padding:15px;
border-radius:12px;
font-size:16px;
margin:20px 0;
}

form{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

label{font-weight:500;}

input,select,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #a5d6a7;
font-size:15px;
}

textarea{resize:vertical;}

.accordion-controls{
display:flex;
gap:10px;
margin:20px 0;
}

.accordion-controls button{
flex:1;
background:#2e7d32;
color:white;
border:none;
padding:10px;
border-radius:8px;
font-size:15px;
cursor:pointer;
}

details{
border:2px solid #c8e6c9;
border-radius:12px;
margin-bottom:15px;
background:#f1f8f4;
}

summary{
background:#2e7d32;
color:white;
padding:15px;
font-size:17px;
cursor:pointer;
border-radius:12px;
}

summary::-webkit-details-marker{display:none;}

.day{margin:15px 0;}

.slots{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
gap:8px;
margin-top:8px;
}

.slots label{
background:#c8e6c9;
padding:6px;
border-radius:6px;
cursor:pointer;
text-align:center;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:25px;
}

.submit{
background:#2e7d32;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
font-size:16px;
}

.reset{
background:#c62828;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
font-size:16px;
}

</style>
</head>

<body>

<div class="container">

<header>
<img src="logo02.png">
<h1>OPEN TENNIS CLUB CHARBONNIERES</h1>
</header>

<div class="explain">
<strong>Cocher les cases où vous êtes libres</strong><br>
Créneaux d’1h de 08h à 23h
</div>

<form method="POST"
action="https://docs.google.com/forms/d/e/1FAIpQLSxxxxxxxxxxxx/formResponse"
onsubmit="return confirmSend()">

<div class="row">
<input name="entry.1111111111" placeholder="Nom *" required>
<input name="entry.5555555555" placeholder="Prénom *" required>
<input type="email" name="entry.8888888888" placeholder="Email *" required>
<input pattern="[0-9]{10}" name="entry.7777777777" placeholder="Téléphone *" required>

<select name="entry.6666666666" required>
<option value="">Classement *</option>
<option>NC</option><option>40</option><option>30/5</option>
<option>30/4</option><option>30/3</option><option>30/2</option>
<option>30/1</option><option>30</option>
<option>15/5</option><option>15/4</option><option>15/3</option>
<option>15/2</option><option>15/1</option><option>15</option>
<option>5/6</option><option>4/6</option><option>3/6</option>
<option>2/6</option><option>1/6</option><option>0</option>
<option>-2/6</option><option>-4/6</option><option>-15</option>
</select>

<input name="entry.4444444444" placeholder="Épreuve *" required>
</div>

<div class="accordion-controls">
<button type="button" onclick="openAll()">Tout ouvrir</button>
<button type="button" onclick="closeAll()">Tout fermer</button>
</div>

<!-- SEMAINE 1 -->
<details>
<summary>📅 Semaine 1</summary>
<div class="day"><strong>Lundi</strong><div class="slots">
<label><input type="checkbox" name="entry.2222222222" value="Lundi 08-09">08-09</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 09-10">09-10</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 10-11">10-11</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 11-12">11-12</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 12-13">12-13</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 13-14">13-14</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 14-15">14-15</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 15-16">15-16</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 16-17">16-17</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 17-18">17-18</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 18-19">18-19</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 19-20">19-20</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 20-21">20-21</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 21-22">21-22</label>
<label><input type="checkbox" name="entry.2222222222" value="Lundi 22-23">22-23</label>
</div></div>
</details>

<textarea name="entry.3333333333" placeholder="Commentaires"></textarea>

<div class="actions">
<button type="reset" class="reset">Réinitialiser</button>
<button type="submit" class="submit">Envoyer</button>
</div>

</form>

</div>

<script>
function openAll(){
document.querySelectorAll("details").forEach(d=>d.open=true);
}
function closeAll(){
document.querySelectorAll("details").forEach(d=>d.open=false);
}
function confirmSend(){
alert("Merci ! Vos disponibilités ont été envoyées.");
return true;
}
</script>

</body>
</html>
