<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modification de disponibilités</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 20px auto;
    padding-bottom: 100px;
  }

  h2 { margin-top: 30px; }

  label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
  }

  input, textarea {
    width: 100%;
    padding: 6px;
    margin-top: 4px;
  }

  textarea { resize: vertical; }

  .info {
    background: #eef;
    padding: 10px;
    border-left: 4px solid #3366cc;
    margin-bottom: 20px;
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .slot-btn {
    padding: 8px;
    background: #2ecc71;
    border: none;
    color: white;
    border-radius: 4px;
    cursor: pointer;
  }

  .slot-btn.active {
    background: #e74c3c;
  }

  .slot-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
  }

  .day-off {
    margin-top: 10px;
    padding: 10px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    width: 100%;
  }

  .day-off.active {
    background: red;
  }

  .hidden { display: none; }

  ul { padding-left: 20px; }

  /* BARRE D’ACTIONS FIXE */
  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 2px solid #3366cc;
    padding: 10px;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 1000;
  }

  #resume {
    background: #f9f9ff;
    border: 2px solid #3366cc;
    padding: 15px;
    margin-top: 30px;
  }
</style>
</head>

<body>

<h1>Modification de disponibilités</h1>

<div class="info" id="tournamentInfo"></div>

<h2>Identité</h2>

<label>Nom</label>
<input id="nom">

<label>Prénom</label>
<input id="prenom">

<label>Numéro de licence</label>
<input id="licence">

<label>Téléphone</label>
<input id="telephone">

<label>Commentaires</label>
<textarea id="commentaires" rows="4"></textarea>

<h2>Date à modifier</h2>

<input type="date" id="date">

<button class="day-off" id="dayOffBtn">
  PAS DISPONIBLE CE JOUR
</button>

<div class="slots" id="slots"></div>

<!-- BARRE DE COMMANDES -->
<div class="action-bar">
  <button onclick="validerJournee()">Valider la journée</button>
  <button id="btnNouvelle" class="hidden" onclick="nouvelleJournee()">Saisir une autre date</button>
  <button id="btnTerminer" class="hidden" onclick="terminer()">Saisie terminée</button>
</div>

<!-- RÉSUMÉ -->
<div id="resume" class="hidden">
  <h2>Résumé avant envoi</h2>
  <ul id="resumeList"></ul>

  <button onclick="envoyer()">Confirmer l’envoi</button>
  <button onclick="supprimerEnvoi()" style="margin-left:10px;">
    Supprimer l’envoi
  </button>
</div>

<script>
/* ================= CONFIG ================= */

const TOURNAMENT_START = "2025-06-20";
const TOURNAMENT_END   = "2025-06-25";

/* ================= INIT ================= */

const slotsContainer = document.getElementById("slots");
const dayOffBtn = document.getElementById("dayOffBtn");
const dateInput = document.getElementById("date");

const selections = [];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("tournamentInfo").innerHTML = `
    🏆 <strong>Tournoi  OPEN du TC CHARBONNIERES :</strong>
    du <strong>${formatDateFR(TOURNAMENT_START)}</strong>
    au <strong>${formatDateFR(TOURNAMENT_END)}</strong><br>
    
    
    <em>La date doit être comprise dans cette période.</em><br>
    <em>Selectionner tout d'abord la journée à modifier.</em><br>
    <em>Cochez les créneaux où vous n'êtes <b>PAS LIBRE !!!</b></em><br>
	
	
  `;

  dateInput.min = TOURNAMENT_START;
  dateInput.max = TOURNAMENT_END;

  genererCreneaux();
});

/* ================= OUTILS ================= */

function formatDateFR(d) {
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}

/* ================= CRENEAUX ================= */

function genererCreneaux() {
  slotsContainer.innerHTML = "";
  for (let h = 8; h < 23; h++) {
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    btn.textContent = `${h}-${h+1}`;
    btn.onclick = () => btn.classList.toggle("active");
    slotsContainer.appendChild(btn);
  }
}

dayOffBtn.onclick = () => {
  const actif = dayOffBtn.classList.toggle("active");
  document.querySelectorAll(".slot-btn").forEach(b => {
    b.disabled = actif;
    b.classList.remove("active");
  });
};

/* ================= VALIDATION ================= */

function validerJournee() {
  if (!dateInput.value) {
    alert("Veuillez saisir une date");
    return;
  }

  const creneaux = [];

  if (dayOffBtn.classList.contains("active")) {
    creneaux.push("PAS DISPONIBLE CE JOUR");
  } else {
    document.querySelectorAll(".slot-btn.active")
      .forEach(b => creneaux.push(b.textContent));
  }

  if (creneaux.length === 0) {
    alert("Aucun créneau sélectionné");
    return;
  }

  selections.push({
    date: dateInput.value,
    creneaux
  });

  alert("Journée enregistrée.");

  document.getElementById("btnNouvelle").classList.remove("hidden");
  document.getElementById("btnTerminer").classList.remove("hidden");
}

/* ================= ENCHAÎNEMENT ================= */

function nouvelleJournee() {
  dateInput.value = "";
  dayOffBtn.classList.remove("active");

  document.querySelectorAll(".slot-btn").forEach(b => {
    b.classList.remove("active");
    b.disabled = false;
  });

  document.getElementById("btnNouvelle").classList.add("hidden");
  document.getElementById("btnTerminer").classList.add("hidden");
}

function terminer() {
  const ul = document.getElementById("resumeList");
  ul.innerHTML = "";

  selections.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${formatDateFR(s.date)} : ${s.creneaux.join(", ")}`;
    ul.appendChild(li);
  });

  document.getElementById("resume").classList.remove("hidden");
  document.getElementById("resume").scrollIntoView({ behavior: "smooth" });
}

/* ================= ENVOI ================= */

function envoyer() {
  alert("Envoi confirmé (connexion Google à venir)");
  console.log(selections);
}

/* ================= SUPPRESSION ================= */

function supprimerEnvoi() {
  if (!confirm("Supprimer toute la saisie ?")) return;

  selections.length = 0;

  nom.value = "";
  prenom.value = "";
  licence.value = "";
  telephone.value = "";
  commentaires.value = "";
  dateInput.value = "";

  dayOffBtn.classList.remove("active");

  document.querySelectorAll(".slot-btn").forEach(b => {
    b.classList.remove("active");
    b.disabled = false;
  });

  document.getElementById("resume").classList.add("hidden");
  document.getElementById("btnNouvelle").classList.add("hidden");
  document.getElementById("btnTerminer").classList.add("hidden");

  alert("Saisie supprimée.");
}
</script>

</body>
</html>
