<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OPEN TENNIS CLUB CHARBONNIERES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Roboto, sans-serif;
background:#e8f5e9;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.15);
}

/* LOGO */
.logo{
text-align:center;
margin-bottom:10px;
}
.logo img{
max-width:140px;
}

/* TITRE */
h1{
text-align:center;
color:#1b5e20;
margin-top:5px;
}

/* TEXTE EXPLICATION */
.explain{
background:#c8e6c9;
padding:12px;
border-radius:10px;
text-align:center;
font-weight:600;
margin-bottom:20px;
}

/* FORM */
label{font-weight:500;}
input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:1px solid #66bb6a;
}

input:required,select:required{
border-left:5px solid #2e7d32;
}

textarea{resize:vertical;}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

/* CRENEAUX */
details{
background:#f1f8e9;
border-radius:12px;
padding:10px;
margin-bottom:15px;
}

summary{
font-size:18px;
font-weight:700;
color:#1b5e20;
cursor:pointer;
}

.time-block h3{
color:#2e7d32;
margin:10px 0;
}

.slots-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
gap:10px;
}

.slot{
background:#e8f5e9;
border:2px solid #66bb6a;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
font-weight:500;
}

.slot input{display:none;}

.slot:has(input:checked){
background:#2e7d32;
color:white;
border-color:#1b5e20;
}

/* BOUTONS */
.buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.submit-btn{
flex:1;
background:#2e7d32;
color:white;
border:none;
padding:14px;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

.reset-btn{
flex:1;
background:#c62828;
color:white;
border:none;
padding:14px;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

@media(max-width:600px){
.row{grid-template-columns:1fr;}
}

</style>
</head>
